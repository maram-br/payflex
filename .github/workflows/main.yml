name: PayFlex CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_scenario:
        description: "Scénario de preuve à exécuter"
        required: true
        default: success
        type: choice
        options:
          - success
          - performance_failure
          - secret_leak

permissions:
  contents: read
  packages: write

env:
  LOCAL_IMAGE: payflex:${{ github.sha }}
  PYTHON_VERSION: "3.12"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2

# Chaîne fail-fast : confidentialité -> UT -> Sonar -> IT -> performance -> déploiement.
jobs:
  secrets-scan:
    name: 1 - Confidentialité et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Préparer les sources à scanner
        run: |
          mkdir -p source-content
          git ls-files -z | tar --null -T - -cf tracked-source.tar
          tar -xf tracked-source.tar -C source-content
          if [ "${{ github.event.inputs.demo_scenario }}" = "secret_leak" ]; then
            mkdir -p source-content/demo
            printf 'demo_card=%s%s%s%s\n' '4111' '1111' '1111' '1111' > source-content/demo/pii.txt
          fi

      - name: Scanner l'historique Git
        id: history_scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --source /repo --config=/repo/.gitleaks.toml --report-format json \
            --report-path /repo/gitleaks-history.json --exit-code 0

      - name: Scanner le code et les configurations
        id: source_scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --no-git --source /repo/source-content --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-source.json --exit-code 0

      - name: Construire une seule image Docker immuable
        id: build
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Extraire l'artefact applicatif et ses métadonnées
        id: extract
        run: |
          mkdir -p artifact-content
          docker create --name payflex-extract "$LOCAL_IMAGE"
          docker cp payflex-extract:/app ./artifact-content/app
          docker inspect payflex-extract > artifact-content/image-metadata.json
          docker rm payflex-extract

      - name: Scanner l'artefact Docker
        id: artifact_scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --no-git --source /repo/artifact-content --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-artifacts.json --exit-code 0

      - name: Gate - taux de confidentialité obligatoire à 100%
        id: secrets_gate
        run: >-
          python scripts/quality_gate.py secrets
          gitleaks-history.json gitleaks-source.json gitleaks-artifacts.json

      - name: Exporter l'image validée
        if: success()
        run: docker save "$LOCAL_IMAGE" -o payflex-image.tar

      - name: Publier l'image pour les jobs suivants
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: payflex-image-${{ github.sha }}
          path: payflex-image.tar
          compression-level: 0
          retention-days: 1

      - name: Rapport d'incident de construction
        if: always() && (steps.history_scan.outcome == 'failure' || steps.source_scan.outcome == 'failure' || steps.build.outcome == 'failure' || steps.extract.outcome == 'failure' || steps.artifact_scan.outcome == 'failure')
        env:
          HISTORY_SCAN: ${{ steps.history_scan.outcome }}
          SOURCE_SCAN: ${{ steps.source_scan.outcome }}
          BUILD: ${{ steps.build.outcome }}
          EXTRACT: ${{ steps.extract.outcome }}
          ARTIFACT_SCAN: ${{ steps.artifact_scan.outcome }}
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : confidentialité / construction"
            echo
            echo "- ❌ Historique=$HISTORY_SCAN, sources=$SOURCE_SCAN, build=$BUILD, extraction=$EXTRACT, artefact=$ARTIFACT_SCAN."
          } | tee reports/incident-build.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapports de confidentialité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          if-no-files-found: ignore
          path: |
            gitleaks-history.json
            gitleaks-source.json
            gitleaks-artifacts.json
            reports/

  unit:
    name: 2 - Tests unitaires et couverture
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Exécuter PyTest
        id: tests
        run: |
          mkdir -p logs reports
          python -m pytest --cov=app --cov-report=xml --cov-report=term \
            --junitxml=reports/junit.xml 2>&1 | tee logs/pytest.log

      - name: Gate - couverture
        id: coverage_gate
        if: always()
        run: python scripts/quality_gate.py unit

      - name: Scanner les logs unitaires
        id: unit_log_scan
        if: always()
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --no-git --source /repo/logs --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-unit-logs.json --exit-code 0

      - name: Gate - confidentialité des logs unitaires
        id: unit_log_gate
        if: always()
        run: python scripts/quality_gate.py secrets gitleaks-unit-logs.json

      - name: Rapport d'incident des tests unitaires
        if: always() && steps.tests.outcome == 'failure'
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : tests unitaires"
            echo
            echo "- ❌ Au moins un test PyTest a échoué. Voir junit.xml et pytest.log."
          } | tee reports/incident-unit-tests.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapports unitaires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          if-no-files-found: ignore
          path: |
            coverage.xml
            gitleaks-unit-logs.json
            logs/
            reports/

  sonar:
    name: 3 - Analyse SonarQube
    needs: unit
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: unit-report

      - name: Démarrer SonarQube Community
        id: sonar_start
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name sonarqube -p 9000:9000 sonarqube:10.6-community
          for i in $(seq 1 60); do
            if curl -s "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          docker logs sonarqube | tail -50
          exit 1

      - name: Configurer le Quality Gate SonarQube
        id: sonar_config
        run: |
          NEW_PW="$(openssl rand -hex 12)Aa1!"
          echo "::add-mask::$NEW_PW"
          INIT_CRED="$(printf '%s:%s' admin admin)"
          ADMIN_CRED="$(printf '%s:%s' admin "$NEW_PW")"
          curl -sf --user "$INIT_CRED" -X POST "$SONAR_HOST_URL/api/users/change_password" \
            -d login=admin -d previousPassword=admin --data-urlencode "password=$NEW_PW"
          TOKEN=$(curl -sf --user "$ADMIN_CRED" -X POST \
            "$SONAR_HOST_URL/api/user_tokens/generate" -d name=ci \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          API="$SONAR_HOST_URL/api/qualitygates"
          post() { curl -sf --user "$ADMIN_CRED" -X POST "$@"; }
          post "$API/create" -d name=PayFlex
          post "$API/create_condition" -d gateName=PayFlex -d metric=coverage -d op=LT -d error=70
          post "$API/create_condition" -d gateName=PayFlex -d metric=bugs -d op=GT -d error=0
          post "$API/create_condition" -d gateName=PayFlex -d metric=vulnerabilities -d op=GT -d error=0
          post "$API/set_as_default" -d name=PayFlex

      - name: Analyser et attendre le Quality Gate
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Avertissements non critiques SonarQube
        if: always() && steps.sonar_scan.outcome != 'skipped'
        run: |
          TOKEN_CRED="$SONAR_TOKEN:"
          curl -s --user "$TOKEN_CRED" \
            "$SONAR_HOST_URL/api/measures/component?component=payflex&metricKeys=code_smells,coverage,sqale_index,bugs,vulnerabilities" \
            > sonar-measures.json || true
          python3 scripts/sonar_warnings.py

      - name: Rapport d'incident SonarQube
        if: always() && (steps.sonar_start.outcome == 'failure' || steps.sonar_config.outcome == 'failure' || steps.sonar_scan.outcome == 'failure')
        env:
          START: ${{ steps.sonar_start.outcome }}
          CONFIG: ${{ steps.sonar_config.outcome }}
          SCAN: ${{ steps.sonar_scan.outcome }}
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : SonarQube"
            echo
            echo "- ❌ Démarrage=$START, configuration=$CONFIG, Quality Gate=$SCAN."
          } | tee reports/incident-sonar.md >> "$GITHUB_STEP_SUMMARY"

      - name: Arrêter SonarQube
        if: always()
        run: docker rm -f sonarqube || true

      - name: Rapports SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          if-no-files-found: ignore
          path: |
            sonar-measures.json
            reports/

  integration:
    name: 4 - Tests d'intégration Newman
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payflex-image-${{ github.sha }}

      - name: Charger et lancer l'image validée
        id: integration_start
        run: |
          docker load -i payflex-image.tar
          docker run -d -p 8000:8000 --name payflex "$LOCAL_IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1

      - name: Exécuter le scénario Newman
        id: newman
        run: |
          mkdir -p logs reports
          npx --yes newman@6.2.1 run postman/payflex.postman_collection.json \
            --env-var baseUrl=http://127.0.0.1:8000 \
            --reporters cli,json --reporter-json-export reports/newman-report.json \
            2>&1 | tee logs/newman.log

      - name: Collecter les logs applicatifs
        if: always()
        run: |
          mkdir -p logs
          docker logs payflex > logs/application-integration.log 2>&1 || true

      - name: Scanner les logs d'intégration
        id: integration_log_scan
        if: always()
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --no-git --source /repo/logs --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-integration-logs.json --exit-code 0

      - name: Gate - confidentialité des logs d'intégration
        id: integration_log_gate
        if: always()
        run: python scripts/quality_gate.py secrets gitleaks-integration-logs.json

      - name: Rapport d'incident d'intégration
        if: always() && (steps.integration_start.outcome == 'failure' || steps.newman.outcome == 'failure')
        env:
          START: ${{ steps.integration_start.outcome }}
          NEWMAN: ${{ steps.newman.outcome }}
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : intégration"
            echo
            echo "- ❌ Démarrage API=$START, scénario Newman=$NEWMAN."
          } | tee reports/incident-integration.md >> "$GITHUB_STEP_SUMMARY"

      - name: Détruire le conteneur éphémère
        if: always()
        run: docker rm -f payflex || true

      - name: Rapports d'intégration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          if-no-files-found: ignore
          path: |
            gitleaks-integration-logs.json
            logs/
            reports/

  performance:
    name: 5 - Tests de performance k6
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: payflex-image-${{ github.sha }}

      - name: Charger et lancer l'image validée
        id: performance_start
        run: |
          docker load -i payflex-image.tar
          DELAY_MS=0
          if [ "${{ github.event.inputs.demo_scenario }}" = "performance_failure" ]; then
            DELAY_MS=600
          fi
          docker run -d -p 8000:8000 --name payflex \
            -e PAYFLEX_DELAY_MS="$DELAY_MS" "$LOCAL_IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1

      - uses: grafana/setup-k6-action@v1

      - name: Exécuter le tir de charge
        id: k6
        run: |
          mkdir -p logs reports
          k6 run -e BASE_URL=http://127.0.0.1:8000 perf/load.js 2>&1 | tee logs/k6.log

      - name: Gate - latence et taux d'erreur
        id: performance_gate
        if: always()
        run: python scripts/quality_gate.py perf

      - name: Collecter les logs applicatifs
        if: always()
        run: |
          mkdir -p logs
          docker logs payflex > logs/application-performance.log 2>&1 || true

      - name: Scanner les logs de performance
        id: performance_log_scan
        if: always()
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect \
            --no-git --source /repo/logs --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-performance-logs.json --exit-code 0

      - name: Gate - confidentialité des logs de performance
        id: performance_log_gate
        if: always()
        run: python scripts/quality_gate.py secrets gitleaks-performance-logs.json

      - name: Rapport d'incident de performance
        if: always() && (steps.performance_start.outcome == 'failure' || steps.k6.outcome == 'failure' || steps.performance_gate.outcome == 'failure')
        env:
          START: ${{ steps.performance_start.outcome }}
          K6: ${{ steps.k6.outcome }}
          GATE: ${{ steps.performance_gate.outcome }}
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : performance"
            echo
            echo "- ❌ Démarrage API=$START, k6=$K6, Quality Gate=$GATE."
          } | tee reports/incident-performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Détruire le conteneur éphémère
        if: always()
        run: docker rm -f payflex || true

      - name: Rapports de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          if-no-files-found: ignore
          path: |
            k6-summary.json
            gitleaks-performance-logs.json
            logs/
            reports/

  deploy:
    name: 6 - Déploiement de l'image validée
    needs: [secrets-scan, unit, sonar, integration, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: payflex-image-${{ github.sha }}

      - name: Charger l'image validée
        run: docker load -i payflex-image.tar

      - name: Publier dans GitHub Container Registry
        id: publish
        run: |
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_IMAGE" "$IMAGE_REF"
          docker push "$IMAGE_REF"
          echo "## ✅ Déploiement autorisé" >> "$GITHUB_STEP_SUMMARY"
          echo "Image publiée : \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport d'incident de déploiement
        if: failure()
        run: |
          mkdir -p reports
          {
            echo "# Rapport d'incident"
            echo
            echo "**Étape** : déploiement"
            echo
            echo "- ❌ La publication de l'image validée dans GHCR a échoué."
          } | tee reports/incident-deploy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport de déploiement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          if-no-files-found: ignore
          path: reports/
